<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SafeRoute AI</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='diabetes-favicon.ico') }}">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='futuristic.css') }}">
    
    <!-- Clerk Authentication -->
    <script
      async
      crossorigin="anonymous"
      data-clerk-publishable-key="{{ clerk_publishable_key }}"
      src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
      type="text/javascript"
    ></script>
    
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--bg-primary);
            position: relative;
            z-index: 10;
        }
        
        .auth-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 3rem;
            backdrop-filter: blur(20px);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        .auth-logo {
            margin-bottom: 2rem;
        }
        
        .auth-logo h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        
        .auth-subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }
        
        #clerk-signin {
            min-height: 400px;
        }
        
        .back-link {
            margin-top: 2rem;
        }
        
        .back-link a {
            color: var(--neon-purple);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }
        
        .back-link a:hover {
            color: var(--neon-cyan);
            transform: translateX(-5px);
        }
    </style>
</head>
<body class="cyber-theme">
    <!-- Animated Background -->
    <div id="particles-js"></div>
    <div class="city-grid"></div>
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="ph ph-shield-checkered" style="font-size: 4rem; color: var(--neon-purple);"></i>
                <h1>SafeRoute AI</h1>
                <p class="auth-subtitle">Sign in to your account</p>
            </div>
            
            <div id="clerk-signin"></div>
            
            <div class="back-link">
                <a href="{{ url_for('home_new') }}">
                    <i class="ph ph-arrow-left"></i>
                    Back to Home
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="{{ url_for('static', filename='futuristic.js') }}"></script>
    
    <script>
        window.addEventListener('load', async function () {
            if (window.Clerk) {
                await Clerk.load();
                
                // Mount the sign in component
                Clerk.mountSignIn(document.getElementById('clerk-signin'), {
                    afterSignInUrl: "{{ url_for('home_new') }}",
                    afterSignUpUrl: "{{ url_for('home_new') }}",
                    redirectUrl: "{{ url_for('home_new') }}"
                });
                
                // If user is already signed in, redirect
                if (Clerk.user) {
                    window.location.href = "{{ url_for('home_new') }}";
                }
            }
        });
    </script>
</body>
</html>
